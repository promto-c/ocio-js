<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OCIO WASM Browser Demo</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <section class="viewer">
        <div class="canvas-stage">
          <canvas id="canvas" class="viewer-canvas" width="960" height="540" aria-label="OCIO WebGL processed sample image"></canvas>
          <canvas id="webgpuCanvas" class="viewer-canvas" width="960" height="540" aria-label="OCIO WebGPU processed sample image" hidden></canvas>
          <canvas id="cpuCanvas" class="viewer-canvas" width="960" height="540" aria-label="OCIO CPU processed sample image" hidden></canvas>
          <p id="status" class="status">Loading OpenColorIO...</p>
        </div>

        <details id="shaderInspector" class="shader-inspector">
          <summary>Shader Inspector <span id="shaderSummary">CPU / no shader</span></summary>
          <div class="shader-toolbar">
            <label>
              View
              <select id="shaderView">
                <option value="used">Shader used</option>
                <option value="generated">Generated shader</option>
                <option value="source">OCIO source</option>
                <option value="resources">Resources</option>
              </select>
            </label>
          </div>
          <pre><code id="shaderCode">Select a GPU renderer to inspect its shader.</code></pre>
        </details>
      </section>

      <aside class="panel">
        <div class="brand">
          <strong>OCIO WASM</strong>
          <span id="version">OpenColorIO</span>
        </div>

        <section class="section">
          <h2 class="section-title">Renderer</h2>
          <label>
            Processing path
            <select id="rendererPath">
              <option value="auto">Auto · best available</option>
              <option value="webgpu">WebGPU · WGSL</option>
              <option value="webgl2">WebGL 2 · GLSL ES 3.0</option>
              <option value="cpu">CPU · WASM</option>
            </select>
          </label>
          <div id="rendererInfo" class="renderer-info">Checking browser GPU support…</div>
        </section>

        <section class="section">
          <h2 class="section-title">Config</h2>
          <label>
            Built-in
            <select id="builtinConfig"></select>
          </label>
          <button id="loadOcioFile" type="button">Load OCIO Config</button>
          <button id="loadConfigFolder" type="button">Load Config Folder</button>
          <button id="resetConfig" type="button">Use Built-in ACES</button>
          <div id="configInfo" class="config-info"></div>
        </section>

        <section class="section">
          <h2 class="section-title">Tone Mapping</h2>
          <label>
            Input
            <select id="source"></select>
          </label>
          <label>
            Display
            <select id="display"></select>
          </label>
          <label>
            View
            <select id="view"></select>
          </label>
          <label>
            Exposure
            <input id="exposure" type="range" min="-4" max="4" value="0" step="0.05">
            <output id="exposureValue">0.00</output>
          </label>
          <label>
            Gain
            <input id="gain" type="range" min="0" max="4" value="1" step="0.01">
            <output id="gainValue">1.00</output>
          </label>
          <label>
            Gamma
            <input id="gamma" type="range" min="0.25" max="3" value="1" step="0.01">
            <output id="gammaValue">1.00</output>
          </label>
          <label class="file">
            <span>Image</span>
            <input id="imageFile" type="file" accept="image/*">
          </label>
          <button id="reset" type="button">Reset Sample</button>
        </section>
      </aside>
    </main>

    <script type="importmap">
      {
        "imports": {
          "@bb-studio/ocio": "../../src/index.js",
        "@bb-studio/ocio/webgpu": "../../src/webgpu.js",
          "#ocio-wasm": "../../dist/ocio-wasm.js",
          "#naga-runtime": "../../src/naga-runtime.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
